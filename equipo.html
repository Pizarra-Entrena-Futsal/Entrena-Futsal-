<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrena Futsal PRO - Scouting & Carga RPE</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap');
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #0a0e17;
      color: #f3f4f6;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Montserrat', sans-serif;
    }
    .bg-card {
      background-color: #121824;
      border: 1px solid #1f293d;
    }
    .bg-card-hover:hover {
      background-color: #1a2234;
    }
    .text-orange-main {
      color: #f97316;
    }
    .bg-orange-main {
      background-color: #f97316;
    }
    .border-orange-main {
      border-color: #f97316;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0e17;
    }
    ::-webkit-scrollbar-thumb {
      background: #1f293d;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f97316;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- TOP NAVBAR -->
  <header class="bg-card border-b border-gray-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-4">
      <a href="index.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition-colors bg-gray-900/80 px-3 py-1.5 rounded-lg border border-gray-800 text-sm">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Volver a la Pizarra</span>
      </a>
      <div class="h-6 w-px bg-gray-800"></div>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-orange-main flex items-center justify-center font-black text-black text-sm">EF</div>
        <div>
          <h1 class="font-heading font-bold text-base text-white leading-none">ENTRENA FUTSAL <span class="text-orange-main">PRO</span></h1>
          <p class="text-xs text-gray-400 mt-0.5">Módulo de Scouting & Análisis de Carga RPE</p>
        </div>
      </div>
    </div>

    <!-- Quick Player Selector Dropdown -->
    <div class="flex items-center gap-3">
      <span class="text-xs text-gray-400 hidden sm:inline"><i class="fa-solid fa-users mr-1"></i> Seleccionar Jugador:</span>
      <select id="playerSelectTop" onchange="changePlayer(this.value)" class="bg-gray-900 border border-gray-700 text-white text-sm rounded-lg px-3 py-2 focus:outline-none focus:border-orange-main cursor-pointer">
        <option value="kiki">Kiki Vaporaki (#10 - Ala Izquierdo)</option>
        <option value="matias">Matías Rosa (#9 - Pívot)</option>
        <option value="luciano">Luciano Gauna (#7 - Ala Doblador)</option>
        <option value="pablo">Pablo Vidal (#11 - Pívot Fijo)</option>
        <option value="cierre">Constantino Vaporaki (#8 - Cierre)</option>
      </select>
    </div>
  </header>

  <!-- MAIN SCOUTING CONTAINER -->
  <main class="flex-1 p-4 lg:p-6 max-w-[1600px] w-full mx-auto space-y-6">
