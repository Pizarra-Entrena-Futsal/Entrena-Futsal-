<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrena Futsal PRO - Videoanálisis Táctico</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Roboto:wght@300;400;500;700&display=swap');
    
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #070a12;
      color: #f3f4f6;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Montserrat', sans-serif;
    }
    .bg-sidebar { background-color: #0b101d; }
    .bg-card { background-color: #111827; border: 1px solid #1f293d; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- TOP HEADER -->
  <header class="bg-sidebar border-b border-slate-800 px-6 py-3 flex flex-wrap justify-between items-center gap-4 z-10">
    <div class="flex items-center gap-4">
      <a href="index.html" class="w-9 h-9 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300 transition-colors" title="Volver al Staff Hub">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-heading font-extrabold text-base text-white leading-none tracking-wide">VIDEOANÁLISIS TÁCTICO</h1>
          <span class="bg-purple-500/20 text-purple-400 text-[10px] font-extrabold px-2 py-0.5 rounded border border-purple-500/30 uppercase">PRO MODULE</span>
        </div>
        <p class="text-[11px] text-slate-400 mt-0.5">Etiquetado de Secuencias, Dibujo Táctico y Clips para Kanban</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <label class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-4 py-2 rounded-xl cursor-pointer transition-all flex items-center gap-2 shadow-lg shadow-purple-600/20">
        <i class="fa-solid fa-file-video"></i> Cargar Video
        <input type="file" id="videoInput" accept="video/*" class="hidden" onchange="cargarVideoLocal(event)">
      </label>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6 p-6 overflow-y-auto">

    <!-- REPRODUCTOR DE VIDEO + LIENZO DE DIBUJO (COL 8) -->
    <div class="lg:col-span-8 space-y-4">
      
      <!-- CONTENEDOR REPRODUCTOR + CANVAS OVERLAY -->
      <div class="relative bg-black rounded-2xl border border-slate-800 overflow-hidden shadow-2xl flex items-center justify-center min-h-[380px]" id="videoContainer">
        
        <!-- ELEMENTO VIDEO -->
        <video id="videoPlayer" class="w-full h-auto max-h-[500px] object-contain" controls crossorigin="anonymous">
          <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
          Tu navegador no soporta el reproductor de video.
        </video>

        <!-- LIENZO DE DIBUJO ENCIMA DEL VIDEO -->
        <canvas id="drawCanvas" class="absolute top-0 left-0 w-full h-full pointer-events-auto cursor-crosshair"></canvas>
      </div>

      <!-- BARRA DE HERRAMIENTAS DE DIBUJO Y CONTROL -->
      <div class="bg-card p-4 rounded-2xl border border-slate-800 flex flex-wrap items-center justify-between gap-4">
        
        <!-- PALETA DE DIBUJO -->
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-slate-400 uppercase mr-1">Dibujo:</span>
          <button onclick="setTool('pen')" id="toolPen" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-white border border-slate-700 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-pen text-purple-400"></i> Lápiz
          </button>
          <button onclick="setTool('arrow')" id="toolArrow" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 border border-slate-700 transition-all flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-right text-sky-400"></i> Flecha
          </button>
          <button onclick="setTool('circle')" id="toolCircle" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 border border-slate-700 transition-all flex items-center gap-1.5">
            <i class="fa-regular fa-circle text-amber-400"></i> Zona
          </button>
          
          <!-- COLORES -->
          <div class="flex items-center gap-1.5 ml-2 border-l border-slate-800 pl-3">
            <button onclick="setColor('#ef4444')" class="w-6 h-6 rounded-full bg-rose-500 border-2 border-white/20 hover:scale-110 transition-transform"></button>
            <button onclick="setColor('#eab308')" class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white/20 hover:scale-110 transition-transform"></button>
            <button onclick="setColor('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white/20 hover:scale-110 transition-transform"></button>
            <button onclick="setColor('#38bdf8')" class="w-6 h-6 rounded-full bg-sky-400 border-2 border-white/20 hover:scale-110 transition-transform"></button>
          </div>

          <button onclick="clearCanvas()" class="ml-2 text-slate-400 hover:text-rose-400 text-xs p-1.5 rounded-lg hover:bg-slate-800 transition-colors" title="Limpiar Dibujos">
            <i class="fa-solid fa-eraser"></i>
          </button>
        </div>

        <!-- CONTROLES DE REPRODUCCIÓN TÁCTICA -->
        <div class="flex items-center gap-2">
          <button onclick="skipTime(-5)" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800 text-xs" title="-5 segundos">
            <i class="fa-solid fa-backward-step"></i> -5s
          </button>
          <button onclick="togglePlay()" id="btnPlayPause" class="px-4 py-2 rounded-xl bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold hover:bg-emerald-500/30 transition-all">
            <i class="fa-solid fa-play"></i> Pausa / Play
          </button>
          <button onclick="skipTime(5)" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800 text-xs" title="+5 segundos">
            +5s <i class="fa-solid fa-forward-step"></i>
          </button>
        </div>

      </div>
    </div>

    <!-- PANEL DE ETIQUETADO Y CLIPS GUARDADOS (COL 4) -->
    <div class="lg:col-span-4 space-y-6">

      <!-- ETIQUETADO RÁPIDO DE EVENTOS -->
      <div class="bg-card p-5 rounded-2xl border border-slate-800 space-y-4">
        <h3 class="font-bold text-sm text-white flex items-center gap-2">
          <i class="fa-solid fa-tags text-purple-400"></i> Registrar Evento Táctico
        </h3>
        <p class="text-xs text-slate-400">Haz clic en una categoría para marcar el fotograma actual con tus notas.</p>
        
        <div class="grid grid-cols-2 gap-2">
          <button onclick="marcarEvento('Salida de Presión 3-1')" class="p-2.5 rounded-xl bg-slate-900 hover:bg-purple-950/40 border border-slate-800 hover:border-purple-500/40 text-xs font-semibold text-slate-200 text-left flex items-center gap-2 transition-all">
            <span class="w-2 h-2 rounded-full bg-purple-400"></span> Salida 3-1
          </button>
          <button onclick="marcarEvento('Presión Alta / Robo')" class="p-2.5 rounded-xl bg-slate-900 hover:bg-rose-950/40 border border-slate-800 hover:border-rose-500/40 text-xs font-semibold text-slate-200 text-left flex items-center gap-2 transition-all">
            <span class="w-2 h-2 rounded-full bg-rose-400"></span> Presión Alta
          </button>
          <button onclick="marcarEvento('ABP - Córner / Banda')" class="p-2.5 rounded-xl bg-slate-900 hover:bg-amber-950/40 border border-slate-800 hover:border-amber-500/40 text-xs font-semibold text-slate-200 text-left flex items-center gap-2 transition-all">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span> ABP Estrategia
          </button>
          <button onclick="marcarEvento('Transición Off / Def')" class="p-2.5 rounded-xl bg-slate-900 hover:bg-sky-950/40 border border-slate-800 hover:border-sky-500/40 text-xs font-semibold text-slate-200 text-left flex items-center gap-2 transition-all">
            <span class="w-2 h-2 rounded-full bg-sky-400"></span> Transición
          </button>
          <button onclick="marcarEvento('Ataque 5v4 / Portero Jugador')" class="col-span-2 p-2.5 rounded-xl bg-slate-900 hover:bg-emerald-950/40 border border-slate-800 hover:border-emerald-500/40 text-xs font-semibold text-slate-200 text-left flex items-center gap-2 transition-all">
            <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Ataque 5v4 / Portero Jugador
          </button>
        </div>
      </div>

      <!-- LISTA DE CLIPS REGISTRADOS -->
      <div class="bg-card p-5 rounded-2xl border border-slate-800 space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-sm text-white flex items-center gap-2">
            <i class="fa-solid fa-list-ul text-sky-400"></i> Secuencias Registradas
          </h3>
          <span id="clipCount" class="bg-slate-800 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded">0</span>
        </div>

        <div id="clipList" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
          <div class="text-center py-8 text-slate-500 text-xs">
            No hay cortes marcados aún.<br>Pausa el video y selecciona un evento.
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- JAVASCRIPT DE VIDEO, DIBUJO Y ENVÍO AL KANBAN CON MULTI-TENANT -->
  <script>
    const video = document.getElementById('videoPlayer');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    
    let isDrawing = false;
    let startX = 0, startY = 0;
    let currentTool = 'pen';
    let currentColor = '#ef4444';
    let clips = [];

    // --- SINCRO TAMAÑO CANVAS CON EL VIDEO ---
    function resizeCanvas() {
      canvas.width = video.clientWidth;
      canvas.height = video.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    video.addEventListener('loadedmetadata', resizeCanvas);

    // --- CONTROLES DE DIBUJO ---
    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('[id^="tool"]').forEach(b => b.classList.replace('bg-purple-600', 'bg-slate-800'));
      const activeBtn = document.getElementById('tool' + tool.charAt(0).toUpperCase() + tool.slice(1));
      if(activeBtn) activeBtn.classList.replace('bg-slate-800', 'bg-purple-600');
    }

    function setColor(color) {
      currentColor = color;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;
      if (currentTool === 'pen') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      if (currentTool === 'pen') {
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineTo(x, y);
        ctx.stroke();
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ctx.strokeStyle = currentColor;
      ctx.fillStyle = currentColor;
      ctx.lineWidth = 3;

      if (currentTool === 'arrow') {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(x, y);
        ctx.stroke();
        // Cabeza de flecha
        const angle = Math.atan2(y - startY, x - startX);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 12 * Math.cos(angle - Math.PI / 6), y - 12 * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(x - 12 * Math.cos(angle + Math.PI / 6), y - 12 * Math.sin(angle + Math.PI / 6));
        ctx.fill();
      } else if (currentTool === 'circle') {
        const radius = Math.sqrt(Math.pow(x - startX, 2) + Math.pow(y - startY, 2));
        ctx.beginPath();
        ctx.arc(startX, startY, radius, 0, 2 * Math.PI);
        ctx.stroke();
      }
    });

    // --- REPRODUCTOR ---
    function togglePlay() {
      if (video.paused) video.play();
      else video.pause();
    }

    function skipTime(seconds) {
      video.currentTime += seconds;
    }

    function cargarVideoLocal(e) {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        video.src = url;
        video.play();
        clearCanvas();
      }
    }

    // --- GENERAR CAPTURA MEZCLANDO VIDEO + DIBUJOS ---
    function generarSnapshot() {
      const offscreen = document.createElement('canvas');
      offscreen.width = video.videoWidth || 640;
      offscreen.height = video.videoHeight || 360;
      const offCtx = offscreen.getContext('2d');

      // 1. Dibujar fotograma de video
      try {
        offCtx.drawImage(video, 0, 0, offscreen.width, offscreen.height);
      } catch (err) {
        console.log("No se pudo extraer frame por restricciones CORS, guardando overlay táctico.");
      }

      // 2. Dibujar overlay del lienzo
      offCtx.drawImage(canvas, 0, 0, offscreen.width, offscreen.height);
      return offscreen.toDataURL('image/png');
    }

    // --- MARCAR EVENTO ---
    function marcarEvento(tipo) {
      video.pause();
      const timeFormatted = new Date(video.currentTime * 1000).toISOString().substr(14, 5);
      const snapshot = generarSnapshot();

      const newClip = {
        id: "clip_" + Date.now(),
        title: `${tipo} (${timeFormatted})`,
        time: timeFormatted,
        notes: `Fotograma analizado a los ${timeFormatted} min.`,
        snapshot: snapshot,
        videoUrl: video.src
      };

      clips.unshift(newClip);
      renderClips();
    }

    function renderClips() {
      const container = document.getElementById('clipList');
      document.getElementById('clipCount').innerText = clips.length;

      if (clips.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">No hay cortes marcados aún.<br>Pausa el video y selecciona un evento.</div>`;
        return;
      }

      container.innerHTML = '';
      clips.forEach(clip => {
        const card = document.createElement('div');
        card.className = "bg-slate-900 border border-slate-800 p-3 rounded-xl space-y-2 text-xs";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-white">${clip.title}</span>
            <button onclick="borrarClip('${clip.id}')" class="text-slate-600 hover:text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
          </div>
          <img src="${clip.snapshot}" class="w-full h-24 object-cover rounded-lg border border-slate-800">
          <div class="pt-2 flex items-center justify-between border-t border-slate-800/80">
            <span class="text-[10px] text-slate-500">Min. ${clip.time}</span>
            <button onclick="enviarClipAlKanban('${clip.id}')" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-[10px] px-2.5 py-1 rounded-lg transition-all flex items-center gap-1 shadow-md shadow-purple-600/20">
              <i class="fa-solid fa-paper-plane"></i> Enviar a Kanban
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function borrarClip(id) {
      clips = clips.filter(c => c.id !== id);
      renderClips();
    }

    // --- FUNCIÓN UNIVERSAL DE ENVÍO AL KANBAN CON MULTI-TENANT ---
    function enviarClipAlKanban(clipId) {
      const clip = clips.find(c => c.id === clipId);
      if (!clip) return;

      enviarAlKanban(clip.title, clip.notes, 'Videoanálisis', clip.snapshot, '');
    }

    function enviarAlKanban(titulo, descripcion, modulo, imagen = '', videoUrl = '') {
      // 1. Obtener ID del usuario activo para guardar en su espacio exclusivo
      const currentUserData = localStorage.getItem('EF_CURRENT_USER');
      const user = currentUserData ? JSON.parse(currentUserData) : null;
      const userId = (user && (user.id || user.name || user.email)) 
        ? (user.id || user.name || user.email).toLowerCase().trim().replace(/[^a-z0-9]/g, '_') 
        : 'default_user';
      
      const storageKey = 'EF_KANBAN_TASKS_' + userId;

      // 2. Cargar tareas previas del usuario
      const tareasPrevias = JSON.parse(localStorage.getItem(storageKey) || '[]');

      // 3. Crear y agregar la nueva tarjeta con foto/video
      tareasPrevias.unshift({
        id: "k_" + Date.now(),
        title: titulo || "Clip de Videoanálisis",
        desc: descripcion || "Sin descripción",
        module: modulo || "Videoanálisis",
        image: imagen || '',
        videoUrl: videoUrl || '',
        status: 'pending',
        date: new Date().toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' })
      });

      // 4. Guardar en memoria
      localStorage.setItem(storageKey, JSON.stringify(tareasPrevias));
      alert('🎬 ¡Clip e informe enviado con éxito al Tablero Kanban de tu espacio!');
    }
  </script>
</body>
</html>
