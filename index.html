<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra Táctica Futsal - @entrenafutsal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    
    /* ENCABEZADO */
    header { width: 100%; max-width: 800px; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #1e1e1e; border-radius: 8px; border-bottom: 3px solid #00e676; margin-bottom: 12px; }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #00e676; }
    .header-text strong { font-size: 18px; color: #fff; display: block; }
    .header-text .handle { color: #00e676; font-weight: bold; font-size: 14px; }
    .stats-link { background: #ff9800; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; }

    /* BARRA DE HERRAMIENTAS */
    .controls-panel { width: 100%; max-width: 800px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; justify-content: center; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 6px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-tool { background: #333; }
    .btn-tool.active { background: #00e676; color: #121212; }
    .btn-anim { background: #9c27b0; }
    .btn-play { background: #e91e63; }
    .btn-video { background: #ff5722; }
    .btn-clear { background: #f44336; }
    .btn-download { background: #0288d1; }

    .anim-counter { background: #262626; color: #00e676; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; display: flex; align-items: center; }

    /* CONTENEDOR CANCHA NATIVA */
    .board-container { width: 100%; max-width: 800px; background: #1e1e1e; padding: 6px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
    canvas { width: 100%; height: auto; display: block; background: #2e7d32; border-radius: 8px; touch-action: none; cursor: crosshair; }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <img src="logo.png.jpg" alt="Logo" class="header-logo" onerror="this.src='logo.png'; this.onerror=null;">
      <div class="header-text">
        <strong>Pizarra Táctica Futsal</strong>
        <span class="handle">@entrenafutsal</span>
      </div>
    </div>
    <a href="stats.html" class="stats-link">📊 Estadísticas</a>
  </header>

  <!-- HERRAMIENTAS DE EDICIÓN -->
  <div class="controls-panel">
    <button class="btn btn-tool active" id="modeMove" onclick="setMode('move')">✋ Mover Fichas</button>
    <button class="btn btn-tool" id="modeDraw" onclick="setMode('draw')">✏️ Dibujar Trazos</button>
    <button class="btn btn-clear" onclick="clearDrawings()">🧹 Borrar Trazos</button>
    <button class="btn btn-clear" onclick="resetPositions()">🔄 Reiniciar Fichas</button>
  </div>

  <!-- PANEL DE ANIMACIÓN Y EXPORTACIÓN -->
  <div class="controls-panel">
    <button class="btn btn-anim" onclick="saveFrame()">➕ Guardar Paso</button>
    <button class="btn btn-play" id="btnPlay" onclick="playAnimation()">▶️ Reproducir</button>
    <button class="btn btn-video" id="btnVideo" onclick="exportVideo()">🎥 Descargar Video</button>
    <button class="btn btn-clear" style="background:#555;" onclick="clearAnimation()">🗑️ Limpiar Pasos</button>
    <div class="anim-counter" id="stepCounter">Pasos: 0</div>
    <button class="btn btn-download" onclick="downloadPhoto()">📷 Descargar Foto</button>
  </div>

  <!-- CANCHA EN CANVAS NATIVO -->
  <div class="board-container">
    <canvas id="futsalCanvas" width="800" height="480"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('futsalCanvas');
    const ctx = canvas.getContext('2d');

    let mode = 'move'; // 'move' o 'draw'
    let isDrawing = false;
    let activePiece = null;
    let steps = [];
    let isPlaying = false;

    // Trazos dibujados
    let drawings = [];
    let currentPath = [];

    // Fichas iniciales
    const initialPieces = [
      { id: 'r1', team: 'red', label: '1', x: 50, y: 240, r: 18 },
      { id: 'r2', team: 'red', label: '2', x: 150, y: 100, r: 18 },
      { id: 'r3', team: 'red', label: '3', x: 150, y: 380, r: 18 },
      { id: 'r4', team: 'red', label: '4', x: 260, y: 180, r: 18 },
      { id: 'r5', team: 'red', label: '5', x: 260, y: 300, r: 18 },

      { id: 'b1', team: 'blue', label: '1', x: 750, y: 240, r: 18 },
      { id: 'b2', team: 'blue', label: '2', x: 650, y: 100, r: 18 },
      { id: 'b3', team: 'blue', label: '3', x: 650, y: 380, r: 18 },
      { id: 'b4', team: 'blue', label: '4', x: 540, y: 180, r: 18 },
      { id: 'b5', team: 'blue', label: '5', x: 540, y: 300, r: 18 },

      { id: 'ball', team: 'ball', label: '⚽', x: 400, y: 240, r: 13 }
    ];

    let pieces = JSON.parse(JSON.stringify(initialPieces));

    // CAMBIO DE MODO
    function setMode(newMode) {
      mode = newMode;
      document.getElementById('modeMove').classList.toggle('active', mode === 'move');
      document.getElementById('modeDraw').classList.toggle('active', mode === 'draw');
    }

    // RENDERIZADO GENERAL
    function render() {
      // 1. Fondo Cancha
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Líneas tácticas
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
      ctx.lineWidth = 3;

      // Borde exterior
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

      // Línea de medio campo
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 12);
      ctx.lineTo(canvas.width / 2, canvas.height - 12);
      ctx.stroke();

      // Círculo central
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
      ctx.stroke();

      // Punto central
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();

      // Área izquierda (6m)
      ctx.beginPath();
      ctx.arc(12, canvas.height / 2, 100, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();

      // Área derecha (6m)
      ctx.beginPath();
      ctx.arc(canvas.width - 12, canvas.height / 2, 100, Math.PI / 2, 3 * Math.PI / 2);
      ctx.stroke();

      // Puntos de penal (6m)
      ctx.beginPath();
      ctx.arc(112, canvas.height / 2, 3, 0, Math.PI * 2);
      ctx.arc(canvas.width - 112, canvas.height / 2, 3, 0, Math.PI * 2);
      ctx.fill();

      // 3. Dibujar Trazos del Usuario
      ctx.strokeStyle = '#ffeb3b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (const path of drawings) {
        if (path.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();
      }

      // 4. Dibujar Fichas
      for (const p of pieces) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);

        if (p.team === 'red') {
          ctx.fillStyle = '#d32f2f';
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 15px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.label, p.x, p.y + 1);

        } else if (p.team === 'blue') {
          ctx.fillStyle = '#1976d2';
          ctx.fill();
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 15px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.label, p.x, p.y + 1);

        } else if (p.team === 'ball') {
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#000000';
          ctx.stroke();

          ctx.font = '13px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('⚽', p.x, p.y + 1);
        }
      }
    }

    // OBTENER COORDENADAS RECTIFICADAS
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function findPiece(x, y) {
      for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        const dx = x - p.x;
        const dy = y - p.y;
        if (dx * dx + dy * dy <= (p.r + 8) * (p.r + 8)) {
          return p;
        }
      }
      return null;
    }

    // EVENTOS DE INTERACCIÓN (MOUSE Y TOUCH)
    function handleStart(e) {
      if (isPlaying) return;
      const pos = getCanvasCoords(e);

      if (mode === 'move') {
        activePiece = findPiece(pos.x, pos.y);
      } else if (mode === 'draw') {
        isDrawing = true;
        currentPath = [pos];
        drawings.push(currentPath);
        render();
      }
    }

    function handleMove(e) {
      if (isPlaying) return;
      const pos = getCanvasCoords(e);

      if (mode === 'move' && activePiece) {
        activePiece.x = Math.max(activePiece.r + 12, Math.min(canvas.width - activePiece.r - 12, pos.x));
        activePiece.y = Math.max(activePiece.r + 12, Math.min(canvas.height - activePiece.r - 12, pos.y));
        render();
      } else if (mode === 'draw' && isDrawing) {
        currentPath.push(pos);
        render();
      }
    }

    function handleEnd() {
      isDrawing = false;
      activePiece = null;
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
    canvas.addEventListener('touchend', handleEnd);

    // ACCIONES DE EDICIÓN
    function clearDrawings() {
      drawings = [];
      render();
    }

    function resetPositions() {
      pieces = JSON.parse(JSON.stringify(initialPieces));
      render();
    }

    // SISTEMA DE ANIMACIÓN
    function saveFrame() {
      const frame = pieces.map(p => ({ id: p.id, x: p.x, y: p.y }));
      steps.push(frame);
      document.getElementById('stepCounter').innerText = `Pasos: ${steps.length}`;
    }

    function clearAnimation() {
      steps = [];
      document.getElementById('stepCounter').innerText = `Pasos: 0`;
    }

    function animateSteps(onComplete) {
      if (steps.length === 0) {
        if (onComplete) onComplete();
        return;
      }

      isPlaying = true;

      // Posicionar en el primer paso
      steps[0].forEach(s => {
        const p = pieces.find(item => item.id === s.id);
        if (p) { p.x = s.x; p.y = s.y; }
      });
      render();

      if (steps.length === 1) {
        isPlaying = false;
        if (onComplete) onComplete();
        return;
      }

      const durationPerStep = 1000; // 1 segundo por paso

      function runNextStep(stepIdx) {
        if (stepIdx >= steps.length - 1) {
          isPlaying = false;
          if (onComplete) onComplete();
          return;
        }

        const startFrame = steps[stepIdx];
        const endFrame = steps[stepIdx + 1];
        let startTime = null;

        function stepAnimation(timestamp) {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / durationPerStep, 1);
          
          // Suavizado Ease-In-Out
          const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;

          for (let i = 0; i < pieces.length; i++) {
            const p = pieces[i];
            const startP = startFrame.find(s => s.id === p.id);
            const endP = endFrame.find(s => s.id === p.id);
            if (startP && endP) {
              p.x = startP.x + (endP.x - startP.x) * ease;
              p.y = startP.y + (endP.y - startP.y) * ease;
            }
          }

          render();

          if (progress < 1) {
            requestAnimationFrame(stepAnimation);
          } else {
            setTimeout(() => runNextStep(stepIdx + 1), 200);
          }
        }

        requestAnimationFrame(stepAnimation);
      }

      setTimeout(() => runNextStep(0), 300);
    }

    function playAnimation() {
      if (isPlaying) return;
      if (steps.length < 2) {
        alert('Guarda al menos 2 pasos para reproducir una animación.');
        return;
      }
      animateSteps();
    }

    // EXPORTACIÓN DE FOTO Y VIDEO NATIVOS
    function downloadPhoto() {
      const link = document.createElement('a');
      link.download = `pizarra-futsal-${new Date().toISOString().slice(0, 10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function exportVideo() {
      if (steps.length < 2) {
        alert('Guarda al menos 2 pasos antes de descargar el video.');
        return;
      }

      const btnVideo = document.getElementById('btnVideo');
      btnVideo.innerText = '⏳ Grabando...';
      btnVideo.disabled = true;

      // Captura directa de la transmisión gráfica del Canvas a 30 FPS
      const stream = canvas.captureStream(30);

      let mimeType = 'video/webm;codecs=vp9';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/webm';
      if (!MediaRecorder.isTypeSupported(mimeType)) mimeType = 'video/mp4';

      let mediaRecorder;
      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      const chunks = [];
      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        const ext = (mediaRecorder.mimeType && mediaRecorder.mimeType.includes('mp4')) ? 'mp4' : 'webm';
        a.download = `animacion-tactica-${new Date().toISOString().slice(0, 10)}.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        btnVideo.innerText = '🎥 Descargar Video';
        btnVideo.disabled = false;
      };

      mediaRecorder.start();

      // Ejecutar la animación y finalizar la grabación
      animateSteps(() => {
        setTimeout(() => {
          mediaRecorder.stop();
        }, 800);
      });
    }

    // Dibujar pantalla inicial
    render();
  </script>
</body>
</html>
