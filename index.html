<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra Táctica Futsal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
    
    header { width: 100%; max-width: 1020px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { width: 40px; height: 40px; background: #1e88e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 2px solid #fff; }
    .brand-title { font-size: 1.1rem; font-weight: bold; }
    .brand-sub { font-size: 0.8rem; color: #00e676; }
    .btn-stats { background: #ff9800; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    
    .toolbar { width: 100%; max-width: 1020px; background: #1e1e1e; border-radius: 10px; padding: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #333; }
    .tool-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
    
    .btn { border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; color: white; transition: all 0.2s; }
    .btn-green  { background: #00c853; }
    .btn-orange { background: #f57c00; }
    .btn-red    { background: #e53935; }
    .btn-coral  { background: #ff5252; }
    .btn-dark   { background: #333333; border: 1px solid #555; }
    .btn-purple { background: #ab47bc; }
    .btn-pink   { background: #ec407a; }
    .btn-grey   { background: #616161; }
    .btn-cyan   { background: #00acc1; }
    .btn:hover  { opacity: 0.9; transform: translateY(-1px); }

    .canvas-container { position: relative; width: 1000px; height: 600px; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #333; }
    canvas { background-color: #2e7d32; display: block; }
    
    .label-tag { font-size: 0.85rem; color: #ccc; margin-right: 5px; font-weight: 600; }
    .badge-step { background: #00c853; padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">⚽</div>
      <div>
        <div class="brand-title">Pizarra Táctica Futsal</div>
        <div class="brand-sub">@entrenafutsal</div>
      </div>
    </div>
    <button class="btn-stats">📊 Estadísticas</button>
  </header>

  <div class="toolbar">
    <div class="tool-row">
      <button class="btn btn-green">✋ Mover / Girar</button>
      <button class="btn btn-orange">✏️ Dibujar Trazos</button>
      <button class="btn btn-red">🧹 Borrar Trazos</button>
      <button class="btn btn-coral" onclick="resetPositions()">🔄 Reiniciar Posiciones</button>
    </div>

    <div class="tool-row">
      <span class="label-tag">Perfilar Ficha:</span>
      <button class="btn btn-dark" onclick="rotateSelected(-45)">↺ -45°</button>
      <button class="btn btn-dark" onclick="rotateSelected(45)">↻ +45°</button>
      <button class="btn btn-dark" onclick="setAngleSelected(0)">➔ Der</button>
      <button class="btn btn-dark" onclick="setAngleSelected(180)">➔ Izq</button>
      <button class="btn btn-dark" onclick="setAngleSelected(270)">⬆ Arriba</button>
      <button class="btn btn-dark" onclick="setAngleSelected(90)">⬇ Abajo</button>
    </div>

    <div class="tool-row">
      <button class="btn btn-purple">➕ Guardar Paso</button>
      <button class="btn btn-pink">▶ Reproducir</button>
      <button class="btn btn-orange">🎥 Descargar Video</button>
      <button class="btn btn-grey">🗑 Limpiar Pasos</button>
      <span class="badge-step">Pasos: 0</span>
      <button class="btn btn-cyan">📸 Descargar Foto</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="tacticCanvas" width="1000" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('tacticCanvas');
    const ctx = canvas.getContext('2d');

    const initialPlayers = [
      // Equipo Verde
      { id: 'g1', team: 'green', role: 'ARQ', label: '1', x: 130, y: 300, r: 20, angle: 0, selected: false },
      { id: 'g2', team: 'green', role: 'JUG', label: '2', x: 250, y: 140, r: 20, angle: 45, selected: false },
      { id: 'g4', team: 'green', role: 'JUG', label: '4', x: 360, y: 230, r: 20, angle: 0, selected: false },
      { id: 'g5', team: 'green', role: 'JUG', label: '5', x: 360, y: 370, r: 20, angle: 0, selected: false },
      { id: 'g3', team: 'green', role: 'JUG', label: '3', x: 250, y: 460, r: 20, angle: -45, selected: false },

      // Equipo Azul
      { id: 'b1', team: 'blue', role: 'ARQ', label: '1', x: 910, y: 300, r: 20, angle: 180, selected: false },
      { id: 'b2', team: 'blue', role: 'JUG', label: '2', x: 770, y: 140, r: 20, angle: 180, selected: true },
      { id: 'b10', team: 'blue', role: 'JUG', label: '10', x: 670, y: 230, r: 20, angle: 180, selected: false },
      { id: 'b5', team: 'blue', role: 'JUG', label: '5', x: 670, y: 370, r: 20, angle: 180, selected: false },
      { id: 'b3', team: 'blue', role: 'JUG', label: '3', x: 770, y: 460, r: 20, angle: 180, selected: false },

      // Balón
      { id: 'ball', team: 'ball', role: 'BALL', label: '', x: 500, y: 300, r: 10, angle: 0, selected: false }
    ];

    let players = JSON.parse(JSON.stringify(initialPlayers));

    function drawCourt() {
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;

      const pad = 30;
      ctx.strokeRect(pad, pad, canvas.width - pad*2, canvas.height - pad*2);

      // Línea central
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, pad);
      ctx.lineTo(canvas.width / 2, canvas.height - pad);
      ctx.stroke();

      // Círculo central
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
      ctx.stroke();

      // Punto central
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Áreas (6 metros)
      ctx.beginPath();
      ctx.arc(pad, canvas.height / 2, 100, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width - pad, canvas.height / 2, 100, Math.PI / 2, Math.PI * 1.5);
      ctx.stroke();

      // Puntos de penalti
      [pad + 100, canvas.width - pad - 100].forEach(x => {
        ctx.beginPath();
        ctx.arc(x, canvas.height / 2, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Porterías
      ctx.strokeRect(pad - 15, canvas.height / 2 - 35, 15, 70);
      ctx.strokeRect(canvas.width - pad, canvas.height / 2 - 35, 15, 70);
    }

    // Renderizado correcto usando círculos fijos (ctx.arc)
    function drawPlayer(p) {
      ctx.save();
      ctx.translate(p.x, p.y);

      if (p.role === 'BALL') {
        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1565c0';
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(0, 0, p.r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#1565c0';
        ctx.fill();
        ctx.restore();
        return;
      }

      let teamColor = '#00c853';
      let textColor = '#008e3c';

      if (p.role === 'ARQ') {
        teamColor = '#121212';
        textColor = '#121212';
      } else if (p.team === 'blue') {
        teamColor = '#1e88e5';
        textColor = '#1565c0';
      }

      // 1. Halo de selección
      if (p.selected) {
        ctx.beginPath();
        ctx.arc(0, 0, p.r * 1.35, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffeb3b';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      // 2. Nariz / Indicador de perfilado (orientación)
      const rad = (p.angle || 0) * Math.PI / 180;
      const bumpDist = p.r * 0.92;
      const bumpRadius = p.r * 0.35;
      const bx = Math.cos(rad) * bumpDist;
      const by = Math.sin(rad) * bumpDist;

      ctx.beginPath();
      ctx.arc(bx, by, bumpRadius, 0, Math.PI * 2);
      ctx.fillStyle = teamColor;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // 3. Círculo base de la ficha
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fillStyle = teamColor;
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();

      // 4. Círculo interior blanco
      const innerRadius = p.r * 0.58;
      ctx.beginPath();
      ctx.arc(0, 0, innerRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // 5. Número
      ctx.fillStyle = textColor;
      ctx.font = `bold ${Math.round(p.r * 0.72)}px Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, 0, 1);

      ctx.restore();
    }

    function render() {
      drawCourt();
      players.forEach(p => drawPlayer(p));
    }

    function rotateSelected(delta) {
      const sel = players.find(p => p.selected);
      if (sel) {
        sel.angle = (sel.angle + delta + 360) % 360;
        render();
      }
    }

    function setAngleSelected(angle) {
      const sel = players.find(p => p.selected);
      if (sel) {
        sel.angle = angle;
        render();
      }
    }

    function resetPositions() {
      players = JSON.parse(JSON.stringify(initialPlayers));
      render();
    }

    let isDragging = false;
    let dragPlayer = null;

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      players.forEach(p => p.selected = false);

      for (let i = players.length - 1; i >= 0; i--) {
        const p = players[i];
        const dist = Math.hypot(p.x - mx, p.y - my);
        if (dist <= p.r * 1.3) {
          p.selected = true;
          dragPlayer = p;
          isDragging = true;
          break;
        }
      }
      render();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging && dragPlayer) {
        const rect = canvas.getBoundingClientRect();
        dragPlayer.x = e.clientX - rect.left;
        dragPlayer.y = e.clientY - rect.top;
        render();
      }
    });

    canvas.addEventListener('mouseup', () => {
      isDragging = false;
      dragPlayer = null;
    });

    render();
  </script>
</body>
</html>
