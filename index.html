<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra Táctica Futsal - @entrenafutsal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #121212; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    
    /* ENCABEZADO */
    header { width: 100%; max-width: 800px; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: #1e1e1e; border-radius: 8px; border-bottom: 3px solid #00e676; margin-bottom: 12px; }
    .header-info { display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid #00e676; }
    .header-text strong { font-size: 18px; color: #fff; display: block; }
    .header-text .handle { color: #00e676; font-weight: bold; font-size: 14px; }
    .stats-link { background: #ff9800; color: #fff; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 13px; }

    /* BARRA DE HERRAMIENTAS */
    .controls-panel { width: 100%; max-width: 800px; display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; justify-content: center; }
    .btn { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 6px; }
    .btn-tool { background: #333; }
    .btn-tool.active { background: #00e676; color: #121212; }
    .btn-anim { background: #9c27b0; }
    .btn-play { background: #e91e63; }
    .btn-clear { background: #f44336; }
    .btn-download { background: #0288d1; }

    .anim-counter { background: #262626; color: #00e676; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; display: flex; align-items: center; }

    /* CONTENEDOR CANCHA */
    #court-wrapper { position: relative; width: 100%; max-width: 800px; height: 480px; background: #2e7d32; border-radius: 10px; border: 4px solid #fff; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.6); touch-action: none; }
    
    /* LINEAS DE FUTSAL */
    .court-lines { position: absolute; width: 100%; height: 100%; pointer-events: none; }
    .line-center { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.8); transform: translateX(-50%); }
    .circle-center { position: absolute; left: 50%; top: 50%; width: 90px; height: 90px; border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; transform: translate(-50%, -50%); }
    .area-left { position: absolute; left: 0; top: 20%; bottom: 20%; width: 110px; border: 2px solid rgba(255,255,255,0.8); border-left: none; border-radius: 0 100px 100px 0; }
    .area-right { position: absolute; right: 0; top: 20%; bottom: 20%; width: 110px; border: 2px solid rgba(255,255,255,0.8); border-right: none; border-radius: 100px 0 0 100px; }

    /* CANVAS DE DIBUJO */
    #drawCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }

    /* FICHAS DE JUGADORES */
    .piece { position: absolute; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: #fff; cursor: grab; user-select: none; z-index: 10; border: 2px solid #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }
    .piece:active { cursor: grabbing; }
    .team-red { background: #d32f2f; }
    .team-blue { background: #1976d2; }
    .ball { background: #fff; color: #000; border: 2px solid #000; width: 22px; height: 22px; font-size: 10px; z-index: 11; }

    /* TRANSICIÓN FLUIDA PARA ANIMACIÓN */
    .piece.animating { transition: left 0.8s ease-in-out, top 0.8s ease-in-out; }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <img src="logo.png.jpg" alt="Logo" class="header-logo" onerror="this.src='logo.png'; this.onerror=null;">
      <div class="header-text">
        <strong>Pizarra Táctica Futsal</strong>
        <span class="handle">@entrenafutsal</span>
      </div>
    </div>
    <a href="stats.html" class="stats-link">📊 Estadísticas</a>
  </header>

  <!-- HERRAMIENTAS Y ACCIONES -->
  <div class="controls-panel">
    <button class="btn btn-tool active" id="modeMove" onclick="setMode('move')">✋ Mover</button>
    <button class="btn btn-tool" id="modeDraw" onclick="setMode('draw')">✏️ Dibujar</button>
    <button class="btn btn-clear" onclick="clearCanvas()">🧹 Borrar Trazos</button>
    <button class="btn btn-clear" onclick="resetPositions()">🔄 Reiniciar Fichas</button>
  </div>

  <!-- PANEL DE ANIMACIÓN PASO A PASO -->
  <div class="controls-panel">
    <button class="btn btn-anim" onclick="saveFrame()">➕ Guardar Paso</button>
    <button class="btn btn-play" onclick="playAnimation()">▶️ Reproducir</button>
    <button class="btn btn-clear" style="background:#555;" onclick="clearAnimation()">🗑️ Limpiar Pasos</button>
    <div class="anim-counter" id="stepCounter">Pasos: 0</div>
    <button class="btn btn-download" onclick="downloadBoard()">📷 Descargar Foto</button>
  </div>

  <!-- CANCHA -->
  <div id="court-wrapper">
    <div class="court-lines">
      <div class="line-center"></div>
      <div class="circle-center"></div>
      <div class="area-left"></div>
      <div class="area-right"></div>
    </div>

    <canvas id="drawCanvas"></canvas>

    <!-- FICHAS ROJAS -->
    <div class="piece team-red" id="r1" style="left: 40px; top: 220px;">1</div>
    <div class="piece team-red" id="r2" style="left: 140px; top: 100px;">2</div>
    <div class="piece team-red" id="r3" style="left: 140px; top: 340px;">3</div>
    <div class="piece team-red" id="r4" style="left: 240px; top: 170px;">4</div>
    <div class="piece team-red" id="r5" style="left: 240px; top: 270px;">5</div>

    <!-- FICHAS AZULES -->
    <div class="piece team-blue" id="b1" style="left: 720px; top: 220px;">1</div>
    <div class="piece team-blue" id="b2" style="left: 620px; top: 100px;">2</div>
    <div class="piece team-blue" id="b3" style="left: 620px; top: 340px;">3</div>
    <div class="piece team-blue" id="b4" style="left: 520px; top: 170px;">4</div>
    <div class="piece team-blue" id="b5" style="left: 520px; top: 270px;">5</div>

    <!-- PELOTA -->
    <div class="piece ball" id="ball" style="left: 389px; top: 229px;">⚽</div>
  </div>

  <script>
    const wrapper = document.getElementById('court-wrapper');
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');
    let currentMode = 'move'; // 'move' o 'draw'
    let isDrawing = false;

    // Ajustar resolución del canvas
    function resizeCanvas() {
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // MODO MOVER / DIBUJAR
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeMove').classList.toggle('active', mode === 'move');
      document.getElementById('modeDraw').classList.toggle('active', mode === 'draw');
      canvas.style.pointerEvents = (mode === 'draw') ? 'auto' : 'none';
    }

    // LÓGICA DE DIBUJO
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('touchstart', (e) => startDraw(e.touches[0]));
    canvas.addEventListener('touchmove', (e) => draw(e.touches[0]));
    canvas.addEventListener('touchend', stopDraw);

    function startDraw(e) {
      if (currentMode !== 'draw') return;
      isDrawing = true;
      const rect = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }

    function draw(e) {
      if (!isDrawing || currentMode !== 'draw') return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.strokeStyle = '#ffeb3b';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    function stopDraw() { isDrawing = false; }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // ARRASTRE DE FICHAS (MOUSE Y TOUCH)
    let activePiece = null;
    let offsetX = 0, offsetY = 0;

    document.querySelectorAll('.piece').forEach(piece => {
      piece.addEventListener('mousedown', startDrag);
      piece.addEventListener('touchstart', (e) => startDrag(e.touches[0], piece));
    });

    function startDrag(e, element) {
      if (currentMode !== 'move') return;
      activePiece = element || e.target;
      activePiece.classList.remove('animating'); // Desactivar transiciones suaves mientras se arrastra
      const rect = activePiece.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;

      document.addEventListener('mousemove', drag);
      document.addEventListener('mouseup', stopDrag);
      document.addEventListener('touchmove', touchDrag);
      document.addEventListener('touchend', stopDrag);
    }

    function drag(e) {
      if (!activePiece) return;
      const wrapperRect = wrapper.getBoundingClientRect();
      let x = e.clientX - wrapperRect.left - offsetX;
      let y = e.clientY - wrapperRect.top - offsetY;

      // Límites de cancha
      x = Math.max(0, Math.min(x, wrapper.clientWidth - activePiece.clientWidth));
      y = Math.max(0, Math.min(y, wrapper.clientHeight - activePiece.clientHeight));

      activePiece.style.left = `${x}px`;
      activePiece.style.top = `${y}px`;
    }

    function touchDrag(e) {
      if (e.touches.length > 0) drag(e.touches[0]);
    }

    function stopDrag() {
      activePiece = null;
      document.removeEventListener('mousemove', drag);
      document.removeEventListener('mouseup', stopDrag);
      document.removeEventListener('touchmove', touchDrag);
      document.removeEventListener('touchend', stopDrag);
    }

    // POSICIONES INICIALES
    const initialPositions = {
      r1: { left: '40px', top: '220px' }, r2: { left: '140px', top: '100px' },
      r3: { left: '140px', top: '340px' }, r4: { left: '240px', top: '170px' },
      r5: { left: '240px', top: '270px' }, b1: { left: '720px', top: '220px' },
      b2: { left: '620px', top: '100px' }, b3: { left: '620px', top: '340px' },
      b4: { left: '520px', top: '170px' }, b5: { left: '520px', top: '270px' },
      ball: { left: '389px', top: '229px' }
    };

    function resetPositions() {
      document.querySelectorAll('.piece').forEach(p => {
        p.classList.remove('animating');
        if (initialPositions[p.id]) {
          p.style.left = initialPositions[p.id].left;
          p.style.top = initialPositions[p.id].top;
        }
      });
    }

    // SISTEMA DE ANIMACIÓN PASO A PASO
    let animationFrames = [];
    let isPlaying = false;

    function saveFrame() {
      const frame = {};
      document.querySelectorAll('.piece').forEach(p => {
        frame[p.id] = { left: p.style.left, top: p.style.top };
      });
      animationFrames.push(frame);
      document.getElementById('stepCounter').innerText = `Pasos: ${animationFrames.length}`;
    }

    function playAnimation() {
      if (animationFrames.length === 0 || isPlaying) return;
      isPlaying = true;

      const pieces = document.querySelectorAll('.piece');
      pieces.forEach(p => p.classList.add('animating'));

      let currentStep = 0;

      function step() {
        if (currentStep >= animationFrames.length) {
          isPlaying = false;
          return;
        }

        const frame = animationFrames[currentStep];
        for (const id in frame) {
          const p = document.getElementById(id);
          if (p) {
            p.style.left = frame[id].left;
            p.style.top = frame[id].top;
          }
        }

        currentStep++;
        setTimeout(step, 1000); // Avanza un paso cada 1 segundo
      }

      step();
    }

    function clearAnimation() {
      animationFrames = [];
      document.getElementById('stepCounter').innerText = `Pasos: 0`;
    }

    // DESCARGAR FOTO
    function downloadBoard() {
      html2canvas(wrapper).then(canvas => {
        const link = document.createElement('a');
        link.download = `pizarra-futsal-${new Date().toISOString().slice(0,10)}.png`;
        link.href = canvas.toDataURL();
        link.click();
      });
    }
  </script>
</body>
</html>
