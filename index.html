<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizarra Táctica Futsal - Entrenafutsal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    
    header {
      width: 100%;
      max-width: 1020px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Estilo adaptado para imagen de logo / miniatura */
    .logo-img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover; /* Evita que la imagen se deforme */
      background-color: #1e88e5;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: bold;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 0.8rem;
      color: #00e676;
    }

    .btn-stats {
      background: #ff9800;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .toolbar {
      width: 100%;
      max-width: 1020px;
      background: #1e1e1e;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border: 1px solid #333;
    }

    .tool-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
    }
    
    .btn {
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      color: white;
      transition: all 0.2s;
    }

    .btn-green  { background: #00c853; }
    .btn-orange { background: #f57c00; }
    .btn-red    { background: #e53935; }
    .btn-coral  { background: #ff5252; }
    .btn-dark   { background: #333333; border: 1px solid #555; }
    .btn-purple { background: #ab47bc; }
    .btn-pink   { background: #ec407a; }
    .btn-grey   { background: #616161; }
    .btn-cyan   { background: #00acc1; }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .canvas-container {
      position: relative;
      width: 1000px;
      height: 600px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 2px solid #333;
    }

    canvas {
      background-color: #2e7d32;
      display: block;
    }
    
    .label-tag {
      font-size: 0.85rem;
      color: #ccc;
      margin-right: 5px;
      font-weight: 600;
    }

    .badge-step {
      background: #00c853;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <!-- Cambia tu-logo.png por la ruta de tu imagen -->
      <img src="tu-logo.png" alt="Logo" class="logo-img" onerror="this.src='https://via.placeholder.com/44/1e88e5/ffffff?text=⚽'">
      <div>
        <div class="brand-title">Pizarra Táctica Futsal</div>
        <div class="brand-sub">@entrenafutsal</div>
      </div>
    </div>
    <button class="btn-stats">📊 Estadísticas</button>
  </header>

  <div class="toolbar">
    <div class="tool-row">
      <button class="btn btn-green">✋ Mover / Girar</button>
      <button class="btn btn-orange">✏️ Dibujar Trazos</button>
      <button class="btn btn-red">🧹 Borrar Trazos</button>
      <button class="btn btn-coral" onclick="resetPositions()">🔄 Reiniciar Posiciones</button>
    </div>

    <div class="tool-row">
      <span class="label-tag">Perfilar Ficha:</span>
      <button class="btn btn-dark" onclick="rotateSelected(-45)">↺ -45°</button>
      <button class="btn btn-dark" onclick="rotateSelected(45)">↻ +45°</button>
      <button class="btn btn-dark" onclick="setAngleSelected(0)">➔ Der</button>
      <button class="btn btn-dark" onclick="setAngleSelected(180)">➔ Izq</button>
      <button class="btn btn-dark" onclick="setAngleSelected(270)">⬆ Arriba</button>
      <button class="btn btn-dark" onclick="setAngleSelected(90)">⬇ Abajo</button>
    </div>

    <div class="tool-row">
      <button class="btn btn-purple">➕ Guardar Paso</button>
      <button class="btn btn-pink">▶ Reproducir</button>
      <button class="btn btn-orange">🎥 Descargar Video</button>
      <button class="btn btn-grey">🗑 Limpiar Pasos</button>
      <span class="badge-step">Pasos: 0</span>
      <button class="btn btn-cyan">📸 Descargar Foto</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="tacticCanvas" width="1000" height="600"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('tacticCanvas');
    const ctx = canvas.getContext('2d');

    const initialPlayers = [
      // Equipo Verde
      { id: 'g1', team: 'green', role: 'ARQ', label: '1', x: 130, y: 300, r: 20, angle: 0, selected: false },
      { id: 'g2', team: 'green', role: 'JUG', label: '2', x: 250, y: 140, r: 20, angle: 45, selected: false },
      { id: 'g4', team: 'green', role: 'JUG', label: '4', x: 360, y: 230, r: 20, angle: 0, selected: false },
      { id: 'g5', team: 'green', role: 'JUG', label: '5', x: 360, y: 370, r: 20, angle: 0, selected: false },
      { id: 'g3', team: 'green', role: 'JUG', label: '3', x: 250, y: 460, r: 20, angle: -45, selected: false },

      // Equipo Azul
      { id: 'b1', team: 'blue', role: 'ARQ', label: '1', x: 910, y: 300, r: 20, angle: 180, selected: false },
      { id: 'b2', team: 'blue', role: 'JUG', label: '2', x: 770, y: 140, r: 20, angle: 180, selected: true },
      { id: 'b10', team: 'blue', role: 'JUG', label: '10', x: 670, y: 230, r: 20, angle: 180, selected: false },
      { id: 'b5', team: 'blue', role: 'JUG', label: '5', x: 670, y: 370, r: 20, angle: 180, selected: false },
      { id: 'b3', team: 'blue', role: 'JUG', label: '3', x: 770, y: 460, r: 20, angle: 180, selected: false },

      // Balón
      { id: 'ball', team: 'ball', role: 'BALL', label: '', x: 500, y: 300, r: 10, angle: 0, selected: false }
    ];

    let players = JSON.parse(JSON.stringify(initialPlayers));

    function drawCourt() {
      ctx.fillStyle = '#2e7d32';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3;

      const pad = 30;
      ctx.strokeRect(pad, pad, canvas.width - pad*2, canvas.height - pad*2);

      // Línea central
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, pad);
      ctx.lineTo(canvas.width / 2, canvas.height - pad);
      ctx.stroke();

      // Círculo central
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
      ctx.stroke();

      // Punto central
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      // Áreas
      ctx.beginPath();
      ctx.arc(pad, canvas.height / 2, 100, -Math.PI / 2, Math.PI / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(canvas.width - pad, canvas.height / 2, 100, Math.PI / 2, Math.PI * 1.5);
      ctx.stroke();

      // Puntos de penalti
      [pad + 100, canvas.width - pad - 100].forEach(x => {
        ctx.beginPath();
        ctx.arc(x, canvas.height / 2, 3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Porterías
      ctx.strokeRect(pad - 15, canvas.height / 2 - 35, 15, 70);
      ctx.strokeRect(canvas.width - pad, canvas.height / 2 - 35, 15, 70);
    }

    function drawPlayer(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.angle || 0) * Math.PI / 180);

      if (p.role === 'BALL') {
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetX = -2;
        ctx.shadowOffsetY = 3;

        ctx.beginPath();
        ctx.arc(0, 0, p.r, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#1565c0';
        ctx.stroke();
        
        ctx.beginPath();
        ctx.arc(0, 0, p.r * 0.4, 0, Math.PI * 2);
        ctx.fillStyle = '#1565c0';
        ctx.fill();

        ctx.restore();
        return;
      }

      let darkColor = '#0b2467';
      let shirtColor = '#8cbef2';
      let innerColor = '#bfe0ff';

      if (p.role === 'ARQ') {
        darkColor = '#121212';
        shirtColor = '#ffd54f';
        innerColor = '#ffffff';
      } else if (p.team === 'green') {
        darkColor = '#0b4d1b';
        shirtColor = '#81c784';
        innerColor = '#c8e6c9';
      }

      const skinColor = '#e19d62';

      ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = -4;
      ctx.shadowOffsetY = 5;

      if (p.selected) {
        ctx.beginPath();
        ctx.arc(0, 0, p.r * 1.5, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffeb3b';
        ctx.lineWidth = 3.5;
        ctx.stroke();
      }

      ctx.shadowColor = 'transparent';

      // Hombros
      ctx.beginPath();
      ctx.ellipse(-p.r * 0.35, 0, p.r * 0.65, p.r * 1.2, 0, -Math.PI / 2, Math.PI / 2);
      ctx.ellipse(-p.r * 0.1, 0, p.r * 0.35, p.r * 0.95, 0, Math.PI / 2, -Math.PI / 2, true);
      ctx.closePath();

      ctx.fillStyle = shirtColor;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = darkColor;
      ctx.stroke();

      // Manos
      const handRadius = p.r * 0.28;
      const hands = [
        { x: -p.r * 0.25, y: -p.r * 1.15 },
        { x: -p.r * 0.25, y: p.r * 1.15 }
      ];

      hands.forEach(h => {
        ctx.beginPath();
        ctx.arc(h.x, h.y, handRadius, 0, Math.PI * 2);
        ctx.fillStyle = skinColor;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = darkColor;
        ctx.stroke();
      });

      // Cabeza exterior
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fillStyle = darkColor;
      ctx.fill();

      // Cabeza interior
      ctx.beginPath();
      ctx.arc(0, 0, p.r * 0.76, 0, Math.PI * 2);
      ctx.fillStyle = innerColor;
      ctx.fill();

      // Número
      ctx.fillStyle = darkColor;
      ctx.font = `bold ${Math.round(p.r * 0.85)}px Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, 0, 1);

      ctx.restore();
    }

    function render() {
      drawCourt();
      players.forEach(p => drawPlayer(p));
    }

    function rotateSelected(delta) {
      const sel = players.find(p => p.selected);
      if (sel) {
        sel.angle = (sel.angle + delta + 360) % 360;
        render();
      }
    }

    function setAngleSelected(angle) {
      const sel = players.find(p => p.selected);
      if (sel) {
        sel.angle = angle;
        render();
      }
    }

    function resetPositions() {
      players = JSON.parse(JSON.stringify(initialPlayers));
      render();
    }

    let isDragging = false;
    let dragPlayer = null;

    canvas.addEventListener('mousedown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      players.forEach(p => p.selected = false);

      for (let i = players.length - 1; i >= 0; i--) {
        const p = players[i];
        const dist = Math.hypot(p.x - mx, p.y - my);
        if (dist <= p.r * 1.3) {
          p.selected = true;
          dragPlayer = p;
          isDragging = true;
          break;
        }
      }
      render();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (isDragging && dragPlayer) {
        const rect = canvas.getBoundingClientRect();
        dragPlayer.x = e.clientX - rect.left;
        dragPlayer.y = e.clientY - rect.top;
        render();
      }
    });

    canvas.addEventListener('mouseup', () => {
      isDragging = false;
      dragPlayer = null;
    });

    render();
  </script>
</body>
</html>
